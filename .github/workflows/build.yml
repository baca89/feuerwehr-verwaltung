name: Build and Push Docker Image

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repo auschecken
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Holt die komplette Git-History


      # 2️⃣ GitHub Container Registry Login
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # 3️⃣ GitVersion installieren
      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.14
        with:
          versionSpec: '5.x'  # GitVersion 5.x installieren

      # 4️⃣ Version ermitteln (Major.Minor.Patch)
      - name: Determine Version
        id: gitversion
        run: |
          git fetch --tags
          VERSION=$(dotnet-gitversion /showvariable SemVer)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 5️⃣ Docker Image bauen & taggen
      - name: Build Docker Image
        run: |
          echo "Building Docker image version ${{ steps.gitversion.outputs.version }}"
          echo "${{ secrets.ENV_FILE }}" > .env
          docker build -t ghcr.io/${{ github.repository }}:${{ steps.gitversion.outputs.version }} -f docker/php/Dockerfile ./src
          docker tag ghcr.io/${{ github.repository }}:${{ steps.gitversion.outputs.version }} ghcr.io/${{ github.repository }}:latest

      # 6️⃣ Docker Image pushen
      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ steps.gitversion.outputs.version }}
          docker push ghcr.io/${{ github.repository }}:latest
