name: Build and Push Docker Image

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: # optional: manuell triggern

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Repo
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # notwendig für GitVersion Tags

      # 2️⃣ Erstelle .env aus Secret
      - name: Create .env from Secret
        run: echo "${{ secrets.ENV_FILE }}" > ./src/.env

      # 3️⃣ Install GitVersion
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.14

      # 4️⃣ Ermittele FullSemVer
      - name: Determine Version
        id: gitversion
        run: |
          git fetch --tags
          VERSION=$(gitversion /showvariable FullSemVer)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 5️⃣ Login zu GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # 6️⃣ Docker Build + Tag
      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ steps.gitversion.outputs.version }} -f docker/php/Dockerfile ./src
          docker tag ghcr.io/${{ github.repository }}:${{ steps.gitversion.outputs.version }} ghcr.io/${{ github.repository }}:latest

      # 7️⃣ Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ steps.gitversion.outputs.version }}
          docker push ghcr.io/${{ github.repository }}:latest
