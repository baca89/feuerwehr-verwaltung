services:
  app:
    image: ghcr.io/baca89/feuerwehr-verwaltung:latest
    container_name: feuerwehr_app
    depends_on:
      - db

  nginx:
    image: nginx:stable
    container_name: feuerwehr_nginx
    ports:
      - "8080:80"
    volumes:
      - /docker/fw/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: feuerwehr_db
    restart: always
    environment:
      MYSQL_DATABASE: feuerwehr
      MYSQL_USER: fwuser
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
